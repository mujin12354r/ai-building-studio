<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>BuildSpace</title><style>body{margin:0;font-family:Arial;background:#111827;color:white}header{padding:15px;background:#1e293b}button{padding:10px;margin:4px;border:0;border-radius:8px}.canvas{width:900px;height:600px;background:#f8fafc;position:relative;margin:20px auto;color:#111;overflow:hidden}.item{position:absolute;padding:15px;font-size:35px;cursor:move}#tools{padding:10px;text-align:center}</style></head><body><header><b>🏗️ BuildSpace</b> — Building & Interior Studio</header><div id="tools"><button onclick="room()">🛋️ Living Room</button><button onclick="room()">🛏️ Bedroom</button><button onclick="add("Sofa","🛋️")">Sofa</button><button onclick="add("Bed","🛏️")">Bed</button><button onclick="add("Table","🪑")">Table</button><button onclick="add("Plant","🪴")">Plant</button><button onclick="styleRoom()">✨ AI Design</button><button onclick="save()">💾 Save</button></div><div class="canvas" id="canvas"></div><script>let c=document.getElementById("canvas"),n=0;function room(){let x=document.createElement("div");x.className="item";x.textContent="▣ ROOM";x.style.left=(50+n%3*280)+"px";x.style.top=(50+Math.floor(n/3)*180)+"px";c.append(x);n++}function add(name,icon){let x=document.createElement("div");x.className="item";x.textContent=icon;x.title=name;x.style.left=100+n%5*130+"px";x.style.top=120+Math.floor(n/5)*100+"px";c.append(x);n++}function styleRoom(){c.style.background="#f5f1e8";alert("AI Japanese minimalist design applied")}function save(){localStorage.setItem("buildspace",c.innerHTML);alert("Design saved")}if(localStorage.getItem("buildspace"))c.innerHTML=localStorage.getItem("buildspace")</script></body></html>
