<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>BuildSpace 2.5D Complete</title>
<style>
:root{--nav:#0b1220;--panel:#f8fafc;--line:#cbd5e1;--blue:#2563eb;--muted:#64748b}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#0b1220;overscroll-behavior:none}
body{touch-action:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
.app{height:100%;display:flex;flex-direction:column;background:#d8e1eb}
.header{height:56px;min-height:56px;background:var(--nav);color:white;display:flex;align-items:center;gap:6px;padding:6px 8px;z-index:100}
.logo{font-weight:900;font-size:17px;white-space:nowrap}.logo span{color:#60a5fa}
.hbtn{background:#1e293b;color:#fff;padding:8px 10px;border-radius:7px;font-weight:800}
.hbtn.primary{background:#2563eb}.hbtn:hover{background:#334155}
.name{width:170px;background:#111827;color:white;border:1px solid #475569;border-radius:7px;padding:8px}
.spacer{flex:1}
.main{position:relative;display:flex;flex:1;min-height:0}
.sidebar{width:300px;min-width:300px;background:var(--panel);border-right:1px solid var(--line);z-index:70;overflow:hidden;transition:.18s}
.sidebar.closed{width:0;min-width:0}
.side{width:300px;height:100%;overflow:auto;padding:10px}
.close{width:100%;padding:9px;background:#e2e8f0;border-radius:7px;font-weight:900;margin-bottom:8px}
.sec{margin:12px 0}.ttl{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;margin:6px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tool{background:#fff;border:1px solid var(--line);border-radius:7px;padding:9px 6px;text-align:left;font-weight:800;font-size:12px}
.tool:hover{background:#eff6ff;border-color:#60a5fa}
.catalog{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.card{border:1px solid var(--line);background:#fff;border-radius:8px;overflow:hidden;user-select:none}
.card:active{transform:scale(.97)}
.card .pic{height:54px;display:flex;align-items:center;justify-content:center;background:#eef2f7;font-size:29px}
.card .nm{font-size:11px;font-weight:900;padding:5px 6px 2px}.card .ds{font-size:9px;color:var(--muted);padding:0 6px 6px}
.workspace{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(#dbe5ef,#9eacbb);touch-action:none}
.scene{position:absolute;width:1300px;height:900px;left:50%;top:50%;transform-origin:center center;user-select:none;touch-action:none}
.ground{position:absolute;left:130px;top:110px;width:1040px;height:650px;background:#b6c1cc;transform:skewY(-27deg);box-shadow:0 30px 35px rgba(0,0,0,.22);border:2px solid #64748b}
.floor{position:absolute;left:130px;top:110px;width:1040px;height:650px;background:#f8fafc;border:4px solid #334155;transform-origin:center;box-shadow:0 20px 28px rgba(0,0,0,.22);overflow:visible}
.floor.iso{transform:skewY(-27deg)}
.floor.top{transform:none}
.grid{position:absolute;inset:0;background-image:linear-gradient(#d8dee7 1px,transparent 1px),linear-gradient(90deg,#d8dee7 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.wall{position:absolute;background:linear-gradient(#7b8794,#596575);border:1px solid #334155;box-shadow:0 7px 9px rgba(0,0,0,.22);z-index:60}
.wall.t{left:-3px;top:-3px;width:100%;height:26px}.wall.l{left:-3px;top:-3px;width:26px;height:100%}.wall.r{right:-3px;top:-3px;width:26px;height:100%}.wall.b{left:-3px;bottom:-3px;width:100%;height:26px}
.room{position:absolute;border:3px solid #334155;background:#fff;z-index:5;overflow:visible}
.room .label{position:absolute;left:8px;top:7px;padding:4px 7px;background:rgba(255,255,255,.9);border-radius:4px;font-size:12px;font-weight:900;pointer-events:none}
.obj{position:absolute;transform-origin:center;touch-action:none;border:2px solid transparent;z-index:80;display:flex;align-items:center;justify-content:center}
.obj.selected{border-color:#2563eb;box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.obj .shadow{position:absolute;left:8%;top:60%;width:84%;height:28%;background:rgba(0,0,0,.18);border-radius:50%;filter:blur(4px);z-index:-1}
.body{position:relative;width:90%;height:80%;border:2px solid rgba(15,23,42,.45);border-radius:7px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 8px rgba(0,0,0,.16);overflow:hidden}
.body:after{content:"";position:absolute;left:0;right:0;top:0;height:35%;background:rgba(255,255,255,.2)}
.body span{font-size:28px;z-index:2;filter:drop-shadow(0 2px 1px rgba(0,0,0,.25))}
.obj .tag{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:9px;background:#0b1220;color:white;padding:2px 4px;border-radius:3px;pointer-events:none}
.handle{position:absolute;width:18px;height:18px;border:2px solid white;border-radius:50%;z-index:5}
.resize{right:-10px;bottom:-10px;background:#2563eb}.rot{left:50%;top:-10px;transform:translateX(-50%);background:#16a34a}
.room.selected{border-color:#2563eb}
.topbar{position:absolute;left:9px;top:9px;z-index:50;display:flex;gap:5px}
.float{background:rgba(11,18,32,.95);color:white;padding:8px 10px;border-radius:8px;font-weight:900;font-size:11px}
.floors{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);z-index:50;background:rgba(11,18,32,.95);border-radius:9px;padding:4px;display:flex;gap:4px;max-width:70%;overflow:auto}
.floors button{background:#334155;color:#fff;border-radius:5px;padding:8px 10px;font-weight:900;font-size:10px;white-space:nowrap}.floors button.active{background:#2563eb}
.zoom{position:absolute;right:9px;bottom:9px;z-index:50;display:flex;gap:4px}.zoom button{width:40px;height:40px;border-radius:7px;background:#0b1220;color:#fff;font-weight:900}
.props{display:none;position:absolute;right:9px;top:9px;width:270px;max-height:calc(100% - 18px);overflow:auto;background:rgba(255,255,255,.98);border:1px solid var(--line);border-radius:11px;padding:11px;z-index:90;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.props.show{display:block}.pt{font-size:16px;font-weight:900;margin-bottom:6px}.hint{font-size:10px;color:var(--muted);margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.row label{display:block;font-size:9px;color:var(--muted);font-weight:900}.row input,.row select{width:100%;padding:7px;border:1px solid var(--line);border-radius:6px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.pgrid button{padding:8px;border-radius:7px;background:#e2e8f0;font-weight:900}.pgrid .red{background:#fee2e2;color:#b91c1c}
.ai{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(550px,92%);background:white;border-radius:13px;padding:17px;z-index:150;box-shadow:0 25px 80px rgba(0,0,0,.4)}.ai.show{display:block}.ai textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:none}.aib{display:flex;gap:7px;margin-top:8px}.aib button{flex:1;padding:10px;border-radius:8px;font-weight:900;background:#e2e8f0}.aib .go{background:#2563eb;color:white}
.toast{position:absolute;left:50%;top:13px;transform:translate(-50%,-75px);background:#0b1220;color:#fff;padding:9px 14px;border-radius:8px;z-index:200;font-weight:800;transition:.2s}.toast.show{transform:translate(-50%,0)}
@media(max-width:800px){
 .header{height:53px;min-height:53px}.logo{font-size:14px}.name,.hideM{display:none}
 .sidebar{position:absolute;top:0;bottom:0;left:0;box-shadow:9px 0 25px rgba(0,0,0,.25)}
 .sidebar.closed{width:300px;min-width:300px;transform:translateX(-100%)}
 .props{width:240px}.floors{max-width:68%}
}
</style>
</head>
<body>
<div class="app">
<header class="header">
<button class="hbtn" onclick="openTools()">TOOLS</button>
<div class="logo">Build<span>Space</span> 2.5D</div>
<input id="projectName" class="name" value="My Building">
<button class="hbtn" onclick="newProject()">NEW</button>
<button class="hbtn" onclick="save()">SAVE</button>
<button class="hbtn hideM" onclick="exportJSON()">EXPORT</button>
<button class="hbtn hideM" onclick="importJSON()">IMPORT</button>
<button class="hbtn primary" onclick="openAI()">AI DESIGN</button>
<button class="hbtn hideM" onclick="exportSVG()">IMAGE</button>
<div class="spacer"></div>
<button class="hbtn hideM" onclick="undo()">UNDO</button>
<button class="hbtn hideM" onclick="redo()">REDO</button>
</header>
<main class="main">
<aside id="sidebar" class="sidebar">
<div class="side">
<button class="close" onclick="closeTools()">CLOSE TOOLS</button>
<div class="sec"><div class="ttl">View</div><div class="g2">
<button class="tool" onclick="view('iso')">2.5D ISOMETRIC</button>
<button class="tool" onclick="view('top')">TOP VIEW</button>
<button class="tool" onclick="fit()">FIT SCREEN</button>
<button class="tool" onclick="center()">CENTER</button>
</div></div>
<div class="sec"><div class="ttl">Room Templates</div><div class="g2">
<button class="tool" onclick="room('Living Room')">LIVING ROOM</button>
<button class="tool" onclick="room('Bedroom')">BEDROOM</button>
<button class="tool" onclick="room('Kitchen')">KITCHEN</button>
<button class="tool" onclick="room('Bathroom')">BATHROOM</button>
<button class="tool" onclick="room('Office')">OFFICE</button>
<button class="tool" onclick="room('Dining Room')">DINING</button>
</div></div>
<div class="sec"><div class="ttl">Furniture Library</div><div id="catalog" class="catalog"></div></div>
<div class="sec"><div class="ttl">Architecture</div><div class="g2">
<button class="tool" onclick="arch('door')">DOOR</button><button class="tool" onclick="arch('window')">WINDOW</button>
<button class="tool" onclick="arch('stairs')">STAIRS</button><button class="tool" onclick="arch('wall')">WALL</button>
</div></div>
<div class="sec"><div class="ttl">Design Style</div>
<select id="style" style="width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:7px">
<option>Modern</option><option>Japanese</option><option>Scandinavian</option><option>Industrial</option><option>Luxury</option><option>Classic</option><option>Minimal</option><option>Natural</option><option>Traditional Korean</option><option>Cyberpunk</option>
</select></div>
<div class="sec"><div class="ttl">Building Presets</div><div class="g2">
<button class="tool" onclick="preset('apartment')">APARTMENT</button><button class="tool" onclick="preset('house')">HOUSE</button>
<button class="tool" onclick="preset('studio')">STUDIO</button><button class="tool" onclick="preset('office')">OFFICE</button>
</div></div>
</div></aside>

<section id="workspace" class="workspace">
<div id="scene" class="scene">
<div class="ground"></div>
<div id="floor" class="floor iso">
<div class="grid"></div><div class="wall t"></div><div class="wall l"></div><div class="wall r"></div><div class="wall b"></div>
<div id="rooms"></div><div id="objects"></div>
</div></div>
<div class="topbar"><button class="float" onclick="toggleProps()">OBJECT SETTINGS</button><button class="float" onclick="openTools()">ADD</button></div>
<div class="floors"><button onclick="setFloor(0)">GROUND</button><button onclick="setFloor(1)">1</button><button onclick="setFloor(2)">2</button><button onclick="setFloor(3)">3</button></div>
<div class="zoom"><button onclick="zoom(-.1)">−</button><button onclick="fit()">FIT</button><button onclick="zoom(.1)">+</button></div>
<div id="props" class="props">
<div class="pt">Object Settings</div><div id="info" class="hint"></div>
<div class="row"><div><label>X</label><input id="x" type="number"></div><div><label>Y</label><input id="y" type="number"></div></div>
<div class="row"><div><label>WIDTH</label><input id="w" type="number"></div><div><label>HEIGHT</label><input id="h" type="number"></div></div>
<div class="row"><div><label>ROTATION</label><input id="r" type="number"></div><div><label>SCALE</label><input id="s" type="number" step=".1"></div></div>
<div class="row"><div><label>DESIGN</label><select id="design"></select></div><div><label>LAYER</label><select id="z"><option value="5">BACK</option><option value="10">NORMAL</option><option value="30">FRONT</option></select></div></div>
<div class="pgrid"><button onclick="apply()">APPLY</button><button onclick="duplicate()">DUPLICATE</button><button onclick="rotate()">ROTATE 15°</button><button class="red" onclick="remove()">DELETE</button></div>
</div>
<div id="ai" class="ai"><h2 style="margin:0 0 5px">AI Interior Designer</h2><p style="font-size:13px;color:#64748b">Describe a room or building. The local designer creates a complete 2.5D arrangement from your prompt.</p><textarea id="prompt" placeholder="Luxury Japanese living room with sectional sofa, TV, coffee table, rug, plants and warm natural style"></textarea><div class="aib"><button onclick="closeAI()">CANCEL</button><button class="go" onclick="generate()">GENERATE DESIGN</button></div></div>
<div id="toast" class="toast"></div>
</section>
</main></div>

<script>
const F=[
["sofa","Sofa","🛋",155,70,["Modern Sofa","Japanese Sofa","Scandinavian Sofa","Luxury Sofa","Industrial Sofa"]],
["sectional","Sectional","▰",220,85,["L Sectional","Modern Sectional","Luxury Sectional","Japanese Sectional"]],
["bed","Double Bed","🛏",165,205,["Double Bed","King Bed","Japanese Bed","Luxury Bed","Minimal Bed"]],
["single","Single Bed","▱",110,180,["Single Bed","Wood Bed","Minimal Bed"]],
["dining","Dining Table","▱",145,80,["Dining Table","Wood Table","Japanese Table","Luxury Table"]],
["coffee","Coffee Table","▭",115,65,["Coffee Table","Glass Table","Japanese Table"]],
["chair","Chair","🪑",55,55,["Modern Chair","Wood Chair","Luxury Chair"]],
["desk","Desk","▤",125,60,["Work Desk","Minimal Desk","Gaming Desk","Executive Desk"]],
["office","Office Chair","◉",60,65,["Office Chair","Executive Chair"]],
["tv","TV","▣",130,38,["TV","Large TV","Wall TV","Cinema Screen"]],
["wardrobe","Wardrobe","▥",105,175,["Wardrobe","Wood Wardrobe","Luxury Wardrobe","Minimal Wardrobe"]],
["shelf","Bookshelf","▤",82,175,["Bookshelf","Wood Shelf","Minimal Shelf","Large Shelf"]],
["plant","Plant","🌿",58,58,["Plant","Bonsai","Large Plant","Indoor Tree"]],
["lamp","Lamp","◉",48,72,["Floor Lamp","Table Lamp","Pendant Lamp","Modern Lamp"]],
["rug","Rug","▭",195,125,["Modern Rug","Japanese Rug","Persian Rug","Minimal Rug"]],
["counter","Kitchen Counter","▬",195,62,["Kitchen Counter","Island Counter","Bar Counter"]],
["island","Kitchen Island","▬",175,76,["Island","Modern Island","Marble Island"]],
["sink","Sink","◯",70,55,["Sink","Modern Sink","Kitchen Sink"]],
["bath","Bathtub","▱",155,72,["Bathtub","Luxury Bath","Japanese Bath"]],
["toilet","Toilet","◉",62,72,["Toilet","Modern Toilet"]],
["night","Nightstand","▥",52,52,["Nightstand","Wood Nightstand","Minimal Nightstand"]],
["fire","Fireplace","▤",115,82,["Fireplace","Modern Fireplace","Luxury Fireplace"]],
["bench","Bench","▬",125,45,["Bench","Wood Bench","Japanese Bench"]],
["mirror","Mirror","▯",80,115,["Wall Mirror","Round Mirror","Luxury Mirror"]]
];
let P={name:"My Building",style:"Modern",floor:0,view:"iso",floors:[0,1,2,3].map(()=>({rooms:[],objects:[]}))};
let selected=null,scale=.7,px=0,py=0,hist=[],future=[],drag=null,pts=new Map(),pinch=null;
const scene=document.getElementById("scene"),floorEl=document.getElementById("floor"),ws=document.getElementById("workspace");
const getF=id=>F.find(f=>f[0]===id), data=()=>P.floors[P.floor], find=()=>data().objects.find(o=>o.id===selected);
function snapshot(){hist.push(JSON.stringify(P));if(hist.length>40)hist.shift();future=[]}
function undo(){if(!hist.length)return;future.push(JSON.stringify(P));P=JSON.parse(hist.pop());selected=null;render()}
function redo(){if(!future.length)return;hist.push(JSON.stringify(P));P=JSON.parse(future.pop());selected=null;render()}
function msg(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(window.tm);window.tm=setTimeout(()=>e.classList.remove("show"),1500)}
function catalog(){const c=document.getElementById("catalog");F.forEach(f=>{const d=document.createElement("div");d.className="card";d.innerHTML=`<div class="pic">${f[2]}</div><div class="nm">${f[1]}</div><div class="ds">Tap to add</div>`;d.onpointerdown=e=>{e.preventDefault();add(f[0])};c.appendChild(d)})}
function room(type){snapshot();const colors={"Living Room":"#fff5d6","Bedroom":"#e2efff","Kitchen":"#e2f7e8","Bathroom":"#def8fa","Office":"#eee8ff","Dining Room":"#ffe8f0"};const n=data().rooms.length;data().rooms.push({id:"r"+Date.now(),type,x:35+(n%3)*315,y:35+Math.floor(n/3)*230,w:290,h:195,color:colors[type]||"#fff"});render();msg(type+" added")}
function add(id,x,y,noSnap=false){if(!noSnap)snapshot();const f=getF(id),n=data().objects.length,pos=[[110,100],[330,105],[570,105],[120,330],[350,345],[590,350],[790,145],[800,390],[680,520]];const p=pos[n%pos.length];const o={id:"o"+Date.now()+Math.random(),type:id,name:f[1],design:f[5][0],x:x??p[0],y:y??p[1],w:f[3],h:f[4],r:0,s:1,z:10};data().objects.push(o);selected=o.id;render();if(!noSnap)msg(f[1]+" added")}
function arch(type){snapshot();const S={door:[90,24],window:[130,24],stairs:[145,125],wall:[250,24]},s=S[type];const o={id:"a"+Date.now(),type,name:type[0].toUpperCase()+type.slice(1),design:type,x:350,y:300,w:s[0],h:s[1],r:0,s:1,z:30,arch:true};data().objects.push(o);selected=o.id;render()}
function render(){document.getElementById("projectName").value=P.name;document.getElementById("style").value=P.style;floorEl.className="floor "+P.view;renderRooms();renderObjects();renderProps();document.querySelectorAll(".floors button").forEach((b,i)=>b.classList.toggle("active",i===P.floor));transform()}
function renderRooms(){const c=document.getElementById("rooms");c.innerHTML="";data().rooms.forEach(r=>{const d=document.createElement("div");d.className="room";d.style.cssText=`left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${r.color}`;d.innerHTML=`<div class="label">${r.type}</div>`;c.appendChild(d)})}
function renderObjects(){const c=document.getElementById("objects");c.innerHTML="";[...data().objects].sort((a,b)=>(a.z||0)-(b.z||0)).forEach(o=>{const f=getF(o.type),d=document.createElement("div");d.className="obj"+(o.id===selected?" selected":"");d.dataset.id=o.id;d.style.cssText=`left:${o.x}px;top:${o.y}px;width:${o.w}px;height:${o.h}px;z-index:${o.z||10};transform:rotate(${o.r||0}deg) scale(${o.s||1})`;let icon=f?f[2]:"■";if(o.type==="door")icon="🚪";if(o.type==="window")icon="▣";if(o.type==="stairs")icon="▤";if(o.type==="wall")icon="▬";d.innerHTML=`<div class="shadow"></div><div class="body"><span>${icon}</span></div><div class="tag">${o.design||o.name}</div>${o.id===selected?'<div class="handle resize"></div><div class="handle rot"></div>':''}`;d.onpointerdown=startDrag;if(o.id===selected){d.querySelector(".resize")?.addEventListener("pointerdown",resizeStart);d.querySelector(".rot")?.addEventListener("pointerdown",rotateStart)}c.appendChild(d)})}
function renderProps(){const p=document.getElementById("props"),o=find();if(!o){p.classList.remove("show");return}p.classList.add("show");document.getElementById("info").textContent=o.name;document.getElementById("x").value=Math.round(o.x);document.getElementById("y").value=Math.round(o.y);document.getElementById("w").value=Math.round(o.w);document.getElementById("h").value=Math.round(o.h);document.getElementById("r").value=Math.round(o.r||0);document.getElementById("s").value=o.s||1;document.getElementById("z").value=o.z||10;const ds=document.getElementById("design");ds.innerHTML="";const f=getF(o.type),a=f?f[5]:[o.design];a.forEach(v=>{const q=document.createElement("option");q.value=v;q.textContent=v;q.selected=v===o.design;ds.appendChild(q)})}
function startDrag(e){e.preventDefault();e.stopPropagation();const o=findBy(e.currentTarget.dataset.id);if(!o)return;selected=o.id;snapshot();drag={mode:"move",id:o.id,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y};render()}
function findBy(id){return data().objects.find(o=>o.id===id)}
function resizeStart(e){e.preventDefault();e.stopPropagation();const o=find();if(!o)return;snapshot();drag={mode:"resize",id:o.id,sx:e.clientX,sy:e.clientY,ow:o.w,oh:o.h}}
function rotateStart(e){e.preventDefault();e.stopPropagation();const o=find();if(!o)return;snapshot();const cr=scene.getBoundingClientRect(),cx=cr.left+(130+o.x+o.w/2)*scale+px,cy=cr.top+(110+o.y+o.h/2)*scale+py;drag={mode:"rotate",id:o.id,cx,cy}}
document.addEventListener("pointermove",e=>{if(!drag)return;const o=findBy(drag.id);if(!o)return;if(drag.mode==="move"){o.x=Math.max(0,Math.min(1010,drag.ox+(e.clientX-drag.sx)/scale));o.y=Math.max(0,Math.min(625,drag.oy+(e.clientY-drag.sy)/scale));const el=document.querySelector(`[data-id="${o.id}"]`);if(el){el.style.left=o.x+"px";el.style.top=o.y+"px"}}else if(drag.mode==="resize"){o.w=Math.max(25,drag.ow+(e.clientX-drag.sx)/scale);o.h=Math.max(25,drag.oh+(e.clientY-drag.sy)/scale);const el=document.querySelector(`[data-id="${o.id}"]`);if(el){el.style.width=o.w+"px";el.style.height=o.h+"px"}}else{o.r=Math.round(Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI+90);const el=document.querySelector(`[data-id="${o.id}"]`);if(el)el.style.transform=`rotate(${o.r}deg) scale(${o.s||1})`}}});
document.addEventListener("pointerup",()=>{if(drag){drag=null;render()}});
function apply(){const o=find();if(!o)return;snapshot();o.x=+x.value;o.y=+y.value;o.w=Math.max(20,+w.value);o.h=Math.max(20,+h.value);o.r=+r.value;o.s=Math.max(.2,+s.value);o.design=design.value;o.z=+z.value;render()}
function duplicate(){const o=find();if(!o)return;snapshot();const q={...o,id:"o"+Date.now()+Math.random(),x:o.x+35,y:o.y+35};data().objects.push(q);selected=q.id;render()}
function remove(){if(!selected)return;snapshot();data().objects=data().objects.filter(o=>o.id!==selected);selected=null;render()}
function rotate(){const o=find();if(!o)return;snapshot();o.r=(o.r+15)%360;render()}
function toggleProps(){if(selected)document.getElementById("props").classList.toggle("show")}
function closeTools(){document.getElementById("sidebar").classList.add("closed")}
function openTools(){document.getElementById("sidebar").classList.remove("closed")}
function setFloor(n){P.floor=n;selected=null;render()}
function view(v){P.view=v;render();fit()}
function zoom(v){scale=Math.max(.3,Math.min(1.5,scale+v));transform()}
function center(){px=0;py=0;transform()}
function fit(){scale=Math.max(.35,Math.min(1.05,Math.min((ws.clientWidth-20)/1300,(ws.clientHeight-20)/900)));center()}
function transform(){scene.style.transform=`translate(calc(-50% + ${px}px),calc(-50% + ${py}px)) scale(${scale})`}
let touch=new Map();
ws.addEventListener("pointerdown",e=>{touch.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touch.size===2){const a=[...touch.values()];pinch={d:distance(a[0],a[1]),s:scale}}});
ws.addEventListener("pointermove",e=>{if(!touch.has(e.pointerId))return;touch.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touch.size===2&&pinch){const a=[...touch.values()];scale=Math.max(.3,Math.min(1.5,pinch.s*distance(a[0],a[1])/pinch.d));transform()}});
["pointerup","pointercancel"].forEach(t=>ws.addEventListener(t,e=>{touch.delete(e.pointerId);if(touch.size<2)pinch=null}));
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function openAI(){document.getElementById("ai").classList.add("show")}
function closeAI(){document.getElementById("ai").classList.remove("show")}
function generate(){const p=document.getElementById("prompt").value.toLowerCase();snapshot();data().rooms=[];data().objects=[];P.style=p.includes("japan")||p.includes("zen")?"Japanese":p.includes("scandinav")||p.includes("nordic")?"Scandinavian":p.includes("industrial")||p.includes("loft")?"Industrial":p.includes("luxury")||p.includes("premium")?"Luxury":p.includes("classic")?"Classic":"Modern";let type=p.includes("bedroom")?"Bedroom":p.includes("kitchen")?"Kitchen":p.includes("office")?"Office":p.includes("bathroom")?"Bathroom":p.includes("dining")?"Dining Room":"Living Room";data().rooms.push({id:"r"+Date.now(),type,x:45,y:45,w:800,h:520,color:"#fff"});let list=type==="Bedroom"?["bed","night","wardrobe","lamp","rug","plant"]:type==="Kitchen"?["counter","island","sink","dining","chair","plant"]:type==="Office"?["desk","office","shelf","lamp","plant","rug"]:type==="Bathroom"?["bath","sink","toilet","mirror","plant"]:["sectional","coffee","tv","rug","plant","lamp","fire"];if(p.includes("bed")&&!list.includes("bed"))list.unshift("bed");if(p.includes("sofa")&&!list.includes("sofa")&&!list.includes("sectional"))list.unshift("sofa");if(p.includes("desk")&&!list.includes("desk"))list.push("desk");if(p.includes("plant")&&!list.includes("plant"))list.push("plant");list.forEach((id,i)=>addNoSnap(id,i));closeAI();render();msg(P.style+" design generated")}
function addNoSnap(id,i){const f=getF(id),pos=[[110,110],[340,110],[590,110],[120,340],[360,350],[600,350],[790,160],[780,410]];const p=pos[i%pos.length];data().objects.push({id:"o"+Date.now()+i,type:id,name:f[1],design:f[5][0],x:p[0],y:p[1],w:f[3],h:f[4],r:0,s:1,z:10})}
function resetData(){P.floors=[0,1,2,3].map(()=>({rooms:[],objects:[]}));P.floor=0}
function preset(t){snapshot();resetData();const d=data();if(t==="apartment"){d.rooms=[{id:"1",type:"Living Room",x:35,y:35,w:450,h:275,color:"#fff5d6"},{id:"2",type:"Kitchen",x:505,y:35,w:330,h:240,color:"#e2f7e8"},{id:"3",type:"Bedroom",x:35,y:330,w:370,h:260,color:"#e2efff"}];["sectional","coffee","tv","plant","counter","sink","bed","wardrobe"].forEach((x,i)=>addNoSnap(x,i))}else if(t==="house"){d.rooms=[{id:"1",type:"Living Room",x:30,y:30,w:450,h:280,color:"#fff5d6"},{id:"2",type:"Dining Room",x:500,y:30,w:335,h:245,color:"#ffe8f0"},{id:"3",type:"Kitchen",x:30,y:330,w:360,h:270,color:"#e2f7e8"},{id:"4",type:"Bedroom",x:410,y:330,w:425,h:270,color:"#e2efff"}];["sofa","coffee","tv","plant","dining","chair","counter","island","bed","wardrobe"].forEach((x,i)=>addNoSnap(x,i))}else if(t==="studio"){d.rooms=[{id:"1",type:"Studio",x:45,y:40,w:790,h:550,color:"#fff"}];["bed","sofa","coffee","desk","chair","tv","plant","wardrobe","rug"].forEach((x,i)=>addNoSnap(x,i))}else{d.rooms=[{id:"1",type:"Office",x:45,y:40,w:790,h:550,color:"#eee8ff"}];["desk","office","desk","office","shelf","plant","lamp","sofa"].forEach((x,i)=>addNoSnap(x,i))}render();msg(t.toUpperCase()+" created")}
function save(){P.name=document.getElementById("projectName").value||"My Building";localStorage.setItem("buildspace25d_complete",JSON.stringify(P));msg("Saved on this device")}
function load(){try{const x=localStorage.getItem("buildspace25d_complete");if(x)P=JSON.parse(x)}catch(e){}}
function newProject(){if(!confirm("Create a new project?"))return;snapshot();P={name:"My Building",style:"Modern",floor:0,view:"iso",floors:[0,1,2,3].map(()=>({rooms:[],objects:[]}))};selected=null;render()}
function exportJSON(){download(new Blob([JSON.stringify(P,null,2)],{type:"application/json"}),(P.name||"buildspace")+".json")}
function importJSON(){const i=document.createElement("input");i.type="file";i.accept=".json,application/json";i.onchange=e=>{const r=new FileReader();r.onload=()=>{try{snapshot();P=JSON.parse(r.result);selected=null;render();msg("Imported")}catch(q){alert("Invalid project file")}};r.readAsText(e.target.files[0])};i.click()}
function exportSVG(){const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900"><rect width="1300" height="900" fill="#cbd5e1"/><rect x="130" y="110" width="1040" height="650" fill="#fff" stroke="#334155" stroke-width="5"/>${data().rooms.map(r=>`<rect x="${130+r.x}" y="${110+r.y}" width="${r.w}" height="${r.h}" fill="${r.color}" stroke="#334155" stroke-width="3"/><text x="${138+r.x}" y="${135+r.y}" font-family="Arial" font-weight="bold">${esc(r.type)}</text>`).join("")}${data().objects.map(o=>`<g transform="translate(${130+o.x+o.w/2} ${110+o.y+o.h/2}) rotate(${o.r||0})"><rect x="${-o.w/2}" y="${-o.h/2}" width="${o.w}" height="${o.h}" fill="#eef2f7" stroke="#334155" stroke-width="2"/><text text-anchor="middle" y="5" font-family="Arial" font-size="13">${esc(o.name)}</text></g>`).join("")}</svg>`;download(new Blob([svg],{type:"image/svg+xml"}),(P.name||"design")+".svg")}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
document.getElementById("style").addEventListener("change",e=>{snapshot();P.style=e.target.value;msg(P.style+" style selected")});
document.getElementById("projectName").addEventListener("change",e=>P.name=e.target.value);
document.addEventListener("keydown",e=>{if(e.key==="Delete")remove();if((e.ctrlKey||e.metaKey)&&e.key==="z"){e.preventDefault();undo()}if((e.ctrlKey||e.metaKey)&&e.key==="y"){e.preventDefault();redo()}if((e.ctrlKey||e.metaKey)&&e.key==="s"){e.preventDefault();save()}});
document.addEventListener("touchmove",e=>{if(e.target.closest(".workspace"))e.preventDefault()},{passive:false});
catalog();load();render();setTimeout(fit,120);window.addEventListener("resize",()=>setTimeout(fit,50));
</script>
</body>
